# cargo-about config — generates the third-party licence NOTICE for the bundled
# Rust dependencies at release (`cargo about generate about.hbs`). The accepted
# set mirrors deny.toml (the PR gate already proves the tree only uses these), so
# NOTICE generation can't hit an unexpected licence at release time.
accepted = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Attribute what actually ships: drop build- and dev-only dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true
