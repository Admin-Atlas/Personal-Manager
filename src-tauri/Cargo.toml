[package]
name = "pm"
version = "3.110.2-alpha"
description = "PM — a local-first personal manager (Archivist + Personal Assistant)"
authors = ["Bobby Yu"]
edition = "2021"
license = "AGPL-3.0-or-later"

# F-53: the release binary bundles SQLCipher + OpenSSL + sqlite-vec at cargo defaults (no LTO,
# 16 codegen units, symbols kept). Thin-LTO + a single codegen unit + stripped symbols shrink the
# binary and can speed hot paths; the trade is a slower release compile. Size / build-time / runtime
# impact is PENDING MEASUREMENT (per the goal directive — no numbers asserted). Debug builds and the
# `just check` gate are unaffected (they use the dev profile).
# Incremental compilation is disabled for dev builds. On this large crate every rebuild minted a
# fresh per-fingerprint `target/debug/incremental/<crate>-<hash>` directory (each ~1–1.5 GB) that
# Cargo never garbage-collected, so the cache grew unbounded (~300 GB observed). Turning it off
# trades a slightly slower warm rebuild for a bounded target dir; correctness and the `just check`
# gate are unaffected. Contributors who want incremental back can override locally in .cargo/config.toml.
[profile.dev]
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (required on Windows).
name = "pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Silent background auto-update + app relaunch after install (desktop only).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Content hashing for document dedupe + stable vault filenames.
sha2 = "0.11"
# Best-effort wipe of raw key material (the DB key) from memory after use. The OS
# keychain stays the real secret boundary; this just shrinks the in-memory window.
zeroize = "1"
# Random-named, RAII-deleted temp files (the voice clip; the export DB snapshot).
tempfile = "3"
# Bundle the data folder (store snapshot + Markdown vault) into one .zip for the
# "Export all data" button. default-features off keeps it to deflate (no bzip2/zstd/aes).
zip = { version = "4", default-features = false, features = ["deflate"] }
# Encrypted backup (Proton Drive / user cloud): the portable `.pmbackup` archive is
# zstd-compressed at level 19 (cold storage — ratio over speed) before the passphrase
# encryption layer. Streaming Encoder/Decoder keeps peak memory flat over a large DB.
zstd = "0.13"

# Encrypted store (SQLCipher / AES-256) + vectors (sqlite-vec) + keyword (FTS5),
# all in one bundled, vendored connection — no system SQLite needed.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "functions", "backup"] }
sqlite-vec = "0.1"

# Random bytes for the generated DB encryption key + the OAuth PKCE verifier/state.
getrandom = "0.4"
hex = "0.4"
# base64url for the PKCE S256 code challenge (Step 6 Google OAuth).
base64 = "0.22"

# --- Shared & Portable Vaults (v2.1.0) ---
# Passphrase-derived key model + at-rest Markdown encryption. argon2id turns a user
# passphrase into the raw 256-bit SQLCipher key (the calibrated cost is stored in the
# non-secret vault-meta.json and read back, never hardcoded). blake3 derives a
# distinct Markdown subkey (derive_key) and the wrong-passphrase verifier
# (keyed_hash) from that master — self-contained, so no second sha2/digest version is
# pulled in beside sha2 0.11. XChaCha20-Poly1305 encrypts the Markdown at rest (its
# 192-bit nonce is safe to pick at random under the many small metadata rewrites).
# uuid mints the stable per-vault id that keys the per-profile keychain cache.
argon2 = "0.5"
blake3 = "1"
# `stream` enables the aead::stream STREAM construction (EncryptorBE32/DecryptorBE32),
# used by the encrypted-backup archive to seal the compressed payload in 1 MiB chunks
# with a per-chunk counter + last-block flag — nonce-reuse-free, and truncation/reorder
# of the archive is cryptographically detectable on restore.
chacha20poly1305 = { version = "0.10", features = ["stream"] }
uuid = { version = "1", features = ["v4"] }
# Passphrase strength floor for every vault/backup create-or-change entry point
# (`vault::kdf::validate_passphrase_strength`, M-4): the same zxcvbn model the UI meter
# shows, so the backend gate and the frontend hint agree. `default-features = false` drops
# the unused `builder` (derive_builder) helper.
zxcvbn = { version = "3", default-features = false }
# Open the system browser for the OAuth consent screen (handles per-OS URL quirks).
open = "5"

# Calendar feed (.ics) parsing — the no-OAuth path (Step 6). chrono/chrono-tz give
# correct timezone handling for event times; rrule expands recurring events within
# the agenda window.
chrono = "0.4"
chrono-tz = "0.10"
rrule = "0.14"

# Local-folder indexing (index-only connector). `file-id` reads a file's OS-stable
# identity (NTFS FileId on Windows, inode on Unix) so a rename/move keeps the same
# indexed item and its classification, rather than reading as delete-plus-add.
# `notify` (+ `notify-debouncer-full`) is the live filesystem watcher: the debouncer
# coalesces the multi-write burst of a save into one settled event and stitches
# rename From→To pairs together, so a folder stays indexed without polling. Both fold
# into the same reconcile the on-demand "Sync now" uses (walk + mtime→hash).
file-id = "0.2"
notify = "8"
notify-debouncer-full = "0.7"

# Hardware scan for the local-AI Workbench (#296): RAM / CPU / disk only. sysinfo 0.39 has no
# GPU/VRAM/battery, so those are hand-rolled per-OS in hardware.rs. default-features off drops the
# network/component/user probes we don't use — leaner binary and licence surface.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# OpenRouter streaming chat client. rustls keeps TLS independent of SQLCipher's crypto.
# `blocking` is used by python_fetch (macOS interpreter download) from inside spawn_blocking.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures-util = "0.3"
tauri-plugin-single-instance = "2"

# OS keychain for all secrets (API key, DB key). Per-platform native backends;
# Linux uses the freedesktop Secret Service over the session D-Bus (KWallet on KDE,
# GNOME Keyring elsewhere) — the one persistent store the desktop actually provides.
# NOT `linux-native` (kernel keyutils): that keyring is cleared on reboot, so the DB
# key minted at first boot would vanish and the SQLCipher store would be permanently
# unreadable at next launch. The sync backend links the system libdbus (a hard
# desktop dependency anyway); the plain (unencrypted) D-Bus session is a decision —
# same-user callers can query the unlocked daemon regardless, so DH session
# encryption buys nothing against the actual threat model.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Windows Hello for the optional, opt-in app-lock (a soft UI gate — see applock.rs).
# Microsoft-maintained bindings (the same `windows` 0.61 Tauri already resolves, so no
# duplicate version); windows-future supplies the `IAsyncOperation::get()` we block on.
windows = { version = "0.61", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    # Sidecar OS sandbox (#286, PR2): run the untrusted-file worker in a no-network AppContainer.
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    # Workbench hardware scan (#461): read a discrete GPU's true VRAM via DXGI, since the WMI
    # AdapterRAM field is a uint32 that saturates at 4 GB (see hardware.rs).
    "Win32_Graphics_Dxgi",
] }
windows-future = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Sidecar OS sandbox (#286, PR2c): `libc` supplies the raw fcntl calls the confined worker's pre_exec
# uses to mark inherited fds close-on-exec (macOS has no close_range). The Seatbelt profile itself needs
# no crate — it rides on the OS `sandbox-exec`. libc is already pulled transitively (MIT/Apache-2.0,
# already allow-listed), so this adds no new licence.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# Sidecar OS sandbox (#286, PR2d): confine the untrusted-file worker on Linux. `landlock` builds the
# filesystem ruleset (its value is the ABI-compat matrix across kernels); `libc` supplies the raw
# prctl/seccomp/landlock/close_range syscalls we impose in the child's pre_exec. Both are also pulled
# transitively already, so this adds no new licences (MIT/Apache-2.0, already allow-listed).
landlock = "0.4"
libc = "0.2"

