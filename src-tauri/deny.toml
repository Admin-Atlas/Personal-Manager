# cargo-deny — the Rust supply-chain gate (advisories + licences + bans + sources
# in one). Run from src-tauri/: `cargo deny check`.
#
# The allow-list below is derived from the ACTUAL dependency tree (`cargo deny
# list`), not a guess — so a new dependency that introduces an unlisted licence
# fails the PR deliberately, surfacing the decision rather than absorbing it
# silently. This is also the single source for the release NOTICE generation.

[advisories]
# Mirror src-tauri/.cargo/audit.toml. Both ids are transitive advisories in Tauri's gtk-rs 0.18
# (Linux WebKit) stack whose affected code PM never reaches; no fix is reachable until Tauri moves
# to gtk 0.19 / glib 0.22 or gtk4. cargo-deny's "workspace" scope already skips transitive
# unsound/unmaintained crates, so these record the decision (and keep `cargo audit`, which warns
# on every crate, quiet). See the 2026-06-17 and 2026-10-07 DECISIONS entries.
#
# The three zip ids (published 2026-10) are all about EXTRACTING a hostile archive (SUID bits kept,
# symlinks out of the destination, permissions applied through symlinks), fixed only in zip 9. PM's
# own zip 4 only WRITES archives (commands/export.rs); the one extract in the tree is
# tauri-plugin-updater 2.13.2's, Windows-only, on update bytes it has already checked against the
# minisign key, and PM's NSIS updates are an .exe it doesn't unzip at all. The updater's latest
# stable still pins zip 4, so upgrading PM's copy alone would clear nothing. Drop these (and bump
# zip) once the updater moves past zip 4. See the 2026-10-17 DECISIONS entry.
ignore = [
  "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter unsound (gtk-rs stack; API never called)
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (via glib-macros 0.18; build-time only)
  "RUSTSEC-2026-0367", # zip 4: SUID/SGID bits kept on extract (PM never extracts; updater: signed bytes)
  "RUSTSEC-2026-0368", # zip 4: extract makes symlinks outside the destination (same)
  "RUSTSEC-2026-0369", # zip 4: extract applies permissions through symlinks (same)
]
# Only treat unmaintained crates that are OUR direct dependencies as failures;
# transitive-unmaintained noise (gtk-rs, etc.) is already covered above.
unmaintained = "workspace"

[licenses]
# Permissive licences present in the tree (from `cargo deny list`). AGPL-3.0 is
# our own crate's licence and is compatible with all of these.
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# r-efi is LGPL-2.1-or-later but only builds for `*-unknown-uefi` targets, so it is
# never linked into PM's Windows/macOS binaries; AGPL-3.0 also absorbs LGPL fine.
# Scope the allowance to that one crate so a NEW LGPL dependency still trips here.
[[licenses.exceptions]]
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

[bans]
# A Tauri tree legitimately carries many duplicate versions; warn (don't fail).
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
