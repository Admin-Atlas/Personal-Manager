name: PR

# The fast, enforced baseline that runs on every pull request. Each ecosystem is
# its own job so a failure is legible at a glance, and every job invokes the same
# `just` recipes the maintainer runs locally and pre-commit runs on commit — one
# source of truth (the justfile), so local and CI cannot drift.
#
# SECURITY: this is `pull_request`, never `pull_request_target`. The latter runs
# with this repo's secrets in the context of the (untrusted) fork head — which
# would put the updater signing key within reach of fork code. Do not change it.
# The token is read-only and no job references a secret, so this is safe on forks.
#
# Actions are SHA-pinned (the repo enforces it); the trailing "# vX.Y.Z" is the
# human-readable version Dependabot reads. Pins mirror release.yml.

# Deliberately NOT filtered by base branch. `branches: [main]` meant a PR based on
# another branch ran no job at all — no lint, no tests, no secret scan, no version
# lockstep — and that is precisely the shape of the stacked PRs this repo uses for
# multi-PR features, so the PRs least likely to be reviewed in isolation were the
# ones with no gate whatsoever. Every PR gets the baseline now; the `version` job's
# bumped-vs-base check reads the PR's own base sha, so on a stacked PR it correctly
# asks "did this bump beyond its parent branch" rather than "beyond main".
on:
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the previous, still-running checks for it.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- frontend: format, lint, type-check (TS / React) --------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Prettier (--check)
        run: just prettier
      - name: ESLint
        run: just eslint
      - name: Type-check (tsc --noEmit)
        run: just tsc
      - name: Frontend tests (vitest)
        run: just frontend-test
      - name: Production bundle (vite build)
        run: just build-frontend
      # Exercises the npm half of `just notice` — the release-only NOTICE trap, half of which was
      # still open: `license-subset` proves the two allow-lists agree, and nothing proved the
      # attribution actually generates. It needs node_modules for the per-package copyright lines,
      # which is why it rides this job rather than `dependencies`. Output discarded; a missing
      # licence text is a non-zero exit.
      - name: Third-party NOTICE (npm half) generates
        run: node scripts/generate-npm-notice.mjs > /dev/null

  # --- backend: format, clippy, check, tests (Rust) -----------------------
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # @stable is a moving branch ref, not a version tag; pinned to its tip with
        # an explicit toolchain so the SHA pin still selects stable. dtolnay force-pushes
        # `stable` to advance the action, which orphans our (vetted, immutable) pin, so
        # zizmor's impostor-commit audit flags it — ignored below. The pinned SHA was the
        # legitimate stable tip when vetted; an immutable pin beats tracking a moving ref.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust) # zizmor: ignore[impostor-commit]
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri build dependencies
        # tauri/wry resolve the GTK/WebKit stack through pkg-config, so even
        # `cargo check`/clippy need these dev packages on the runner. libdbus-1-dev
        # backs the keyring crate's Secret Service backend (Linux secrets store).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: rustfmt (--check)
        run: just cargo-fmt
      - name: Clippy (-D warnings)
        run: just clippy
      - name: cargo check (--tests)
        run: just cargo-check
      - name: cargo test
        run: just rust-test

  # --- backend on Windows: the shipped-OS compile/lint gate (T-01) ---------
  # The Linux `rust` job compiles out every #[cfg(windows)] path, so a Windows-only
  # compile error or clippy lint is invisible on a PR and first surfaces in the
  # release build matrix — the green-PR≠green-release class this repo has been burned
  # by. This runs clippy + `cargo check --tests` on windows-latest so that class fails
  # a PR instead of a release. It also runs the `vault::` test subset (only), so the
  # shared-folder ACL logic — icacls lockdown, effective-access probes, the verify-then-
  # commit relocate — is exercised on a real NTFS + icacls host, the one place those tests
  # mean anything (the Linux job's tempfs can't reproduce a Windows DACL lockout).
  #
  # NB: we invoke cargo DIRECTLY, not through `just`. The justfile forces `bash -c`,
  # and Git-Bash's MSYS perl shadows Strawberry Perl, breaking the vendored-OpenSSL
  # SQLCipher build — so the recipes are mirrored here in the default (pwsh) shell,
  # exactly as release.yml's proven windows build leg compiles. The `fetch-python`
  # step stages the bundled interpreter the Windows build script needs (a no-op the
  # Linux job gets via the recipe dependency).
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Rust
        # See the Linux rust job for the impostor-commit / moving-ref rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust) # zizmor: ignore[impostor-commit]
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Fetch bundled interpreter (the Windows build script needs it present)
        run: node scripts/fetch-python.mjs
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo check (--tests)
        run: cargo check --all-targets --tests --manifest-path src-tauri/Cargo.toml
      - name: "cargo test (vault:: — ACL/probe/migration on real NTFS)"
        run: "cargo test --lib --manifest-path src-tauri/Cargo.toml vault::"

  # --- backend on macOS: the shipped-OS compile/lint gate for the mac arm ---
  # Both the Linux `rust` and Windows `rust-windows` jobs compile out every
  # #[cfg(target_os = "macos")] path (the sandbox-exec worker confinement, #286
  # PR2c), so a macOS-only compile error, clippy lint, or dead-code warning is
  # otherwise invisible until the release build on a Mac — worse than the Windows
  # blind spot, and exactly the class that failed the Linux arm's first PR (an
  # arch-only dead-code lint the Windows gate could not see). This job compiles +
  # lints the mac arm on every PR. It cannot RUN the sandbox (that needs a real
  # signed session and is the #[ignore] confined_worker_smoke_macos test on a Mac),
  # but it makes the whole arm's compile/lint gate real. cargo is invoked directly
  # (as in rust-windows); fetch-python stages the interpreter the build script needs.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Rust
        # See the Linux rust job for the impostor-commit / moving-ref rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust) # zizmor: ignore[impostor-commit]
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Fetch bundled interpreter (the build script needs it present)
        run: node scripts/fetch-python.mjs
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo check (--tests)
        run: cargo check --all-targets --tests --manifest-path src-tauri/Cargo.toml
      - name: "cargo test (sidecar:: — compiles + exercises the mac arm's unit tests)"
        run: "cargo test --lib --manifest-path src-tauri/Cargo.toml sidecar::"

  # --- sidecar: lint + format (Python) ------------------------------------
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.15.18
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Ruff (check)
        run: just ruff
      - name: Ruff (format --check)
        run: just ruff-fmt
      - name: Sidecar unit tests
        run: just sidecar-test

  # --- secrets: gitleaks over the working tree AND git history ------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `just gitleaks-history` can sweep every commit, not just
          # the checked-out tree (a secret committed then deleted lingers in history).
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        # The CLI binary (not the Action) — keeps the check identical to local
        # `just gitleaks` and avoids the Action's comment/permission surface.
        #
        # Downloaded to a FILE and checksummed before it is unpacked, never piped
        # straight into /usr/local/bin. Every `uses:` in this repo is SHA-pinned (and
        # now gated); a tarball fetched over the network was the one executable that
        # arrived with no integrity check at all. The digest is gitleaks' own
        # published checksums.txt entry, and moves only when the pinned version does.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/$asset" gitleaks
          gitleaks version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Scan the working tree for secrets
        run: just gitleaks
      - name: Scan git history for secrets
        run: just gitleaks-history

  # --- dependencies: CVEs + licences across all three ecosystems ----------
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust — cargo-deny (advisories + licences + bans + sources)
        # Runs `cargo deny check` against src-tauri/ (finds src-tauri/deny.toml next
        # to the manifest) — identical to local `just deny`.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./src-tauri/Cargo.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Python — pip-audit (sidecar deps)
        run: just pip-audit
      - name: JS — npm audit
        run: just npm-audit

      # The Rust half of the same trap. cargo-about renders about.hbs at RELEASE time only, so a
      # broken template or a crate whose licence about.toml does not accept would have failed the
      # publish job after the binaries were already built. Same checksummed install as release.yml.
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: "0.9.0"
          CARGO_ABOUT_SHA256: "7a1a1bfb3ae3b6feabe9e1d6147a6b34b85bd0339bfd8b0ec11b312dee10d99a"
        shell: bash
        run: |
          set -euo pipefail
          asset="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLo "$RUNNER_TEMP/$asset.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/$asset.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$asset.tar.gz" | sha256sum --check --strict
          tar -xz -C /usr/local/bin --strip-components=1 -f "$RUNNER_TEMP/$asset.tar.gz" "$asset/cargo-about"
      - name: Third-party NOTICE (Rust half) generates
        run: cd src-tauri && cargo about generate about.hbs -o /dev/null

  # --- workflow security: zizmor over .github/workflows -------------------
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: pip install zizmor==1.26.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Audit workflows
        # GH_TOKEN lets zizmor's online audits run without hitting rate limits;
        # the token is read-only (contents: read).
        env:
          GH_TOKEN: ${{ github.token }}
        run: just zizmor

  # --- version: lockstep + bumped-vs-base + changelog (the highest-value gate)
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base commit is present for the bumped-vs-base check.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Version lockstep + bump + changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just version --base "$BASE_SHA"

  # --- hygiene: files-in-place + SPDX headers + licence integrity ---------
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Files-in-place
        run: just files
      - name: SPDX headers + licence integrity
        run: just headers
      - name: Licence allow-lists agree (deny ⊆ about)
        run: just license-subset
      - name: CI membership (justfile ⊆ pr.yml)
        run: just ci-membership
      - name: Sync-set register covers every table
        run: just sync-set
      - name: Every ipc.ts command name is one the backend registers
        run: just ipc-commands
      - name: scripts/ stays zero-dependency (allowlisted exceptions only)
        run: just script-deps
      - name: Every workflow `uses:` is SHA-pinned
        run: just action-pins
      - name: The sidecar dependency locks are current, pinned and hashed
        run: just requirements-lock
      - name: Every CI job runs the declared Node major
        run: just node-version
      - name: Every shipped npm package carries an accepted licence
        run: just npm-licenses
      - name: Every sidecar Python package carries a reviewed licence
        run: just sidecar-licences
      - name: Every catalogued local model carries a reviewed licence
        run: just model-licences
