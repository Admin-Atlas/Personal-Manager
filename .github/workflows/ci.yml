name: CI

# Fast correctness gate on every pull request: type-check the frontend and
# `cargo check` the Rust backend (tests included). It references no secrets and
# the token is read-only, so it is safe on fork PRs.
#
# SECURITY: this is `pull_request`, never `pull_request_target`. The latter runs
# with this repo's secrets in the context of the (untrusted) fork head — which
# would put the updater signing key within reach of fork code. Do not change it.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned; the trailing "# vX.Y.Z" is the human-readable
      # version (and what Dependabot reads). Keep it. Pins mirror release.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsconfig already sets noEmit; this is exactly what `npm run build`'s
      # `tsc` step does, minus the Vite bundle — a pure type-check.
      - name: Type-check the frontend (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Install Rust
        # @stable is a moving branch ref, not a version tag; pinned to its tip
        # with an explicit toolchain so the SHA pin still selects stable.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri build dependencies
        # tauri/wry resolve the GTK/WebKit stack through pkg-config, so even
        # `cargo check` needs these dev packages on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libssl-dev

      - name: Check the Rust backend (cargo check --tests)
        run: cargo check --tests --manifest-path src-tauri/Cargo.toml
