name: Release

# Cut a release by pushing a version tag:
#   npm version <patch|minor|major> --no-git-tag-version   # bumps package.json
#   # bump src-tauri/tauri.conf.json + Cargo.toml to match, regenerate lockfiles,
#   # add the changelog entry, commit, then:
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds + signs the desktop apps here, then attaches the installers and the
# updater manifest (latest.json) to this repo's own Releases (via GITHUB_TOKEN) so
# every desktop can fetch updates.
#
# Gating: the `guards` job is a HARD pre-flight (version == tag across the lockstep
# set, changelog entry present, AGPL licence + source headers unmodified). It runs
# before anything that touches the signing key, so a bad tag never reaches it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/publish (e.g. v0.2.0)"
        required: true

env:
  # Releases attach to this repo; github.repository resolves to <owner>/<name>.
  RELEASES_REPO: ${{ github.repository }}

# Least privilege by default; only the publish job is elevated to write (below).
permissions:
  contents: read

# One release run per tag. Deliberately NOT cancel-in-progress: a half-published
# release — assets uploaded, latest.json not yet — is worse than a queued one, so a
# second dispatch for the same tag waits rather than killing the first mid-upload.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # --- pre-flight gate (no secrets, runs first) ---------------------------
  guards:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Validate the tag BEFORE checking anything out — the regex needs no working
      # tree, and the resolved tag is what the checkout below then uses as its ref.
      - name: Resolve + validate version
        id: ver
        shell: bash
        # Bind the (attacker-influenceable) dispatch input through env — never
        # inline ${{ }} expansion into the script body — and reject anything that
        # isn't a vX.Y.Z tag with an optional pre-release suffix (e.g. v2.0.0-alpha),
        # so it can't be used for shell injection on the runner that holds the signing
        # key. The suffix charset stays shell-safe: digits, letters, dot and dash only.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to build from an unexpected tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Check out THE TAG, explicitly. Without a `ref:` this resolved to the tag only
      # on the `push: tags` trigger; on workflow_dispatch it resolved to whatever
      # branch the dispatch was started from — so re-running a release for an older
      # tag built main's current HEAD and published it under that tag. The version
      # guard below could not catch it, because it reads the manifests it was just
      # handed. A dispatch naming a tag that does not exist now fails here instead of
      # quietly shipping something else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Version lockstep == tag (+ all files agree, + changelog entry)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: just version --tag "$TAG"

      - name: AGPL licence + source headers unmodified
        run: just headers

  build:
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          # Pinned, NOT ubuntu-latest: the AppImage bundles webkit/gtk but never
          # glibc, so the build runner's distro sets the artifact's glibc floor.
          # Building on the oldest supported LTS keeps the AppImage running on
          # Ubuntu 22.04 / Debian 12-era systems; `-latest` would silently raise
          # the floor whenever GitHub re-points the alias. Bump deliberately.
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are SHA-pinned; the trailing "# vX.Y.Z" is the human-readable
      # version (and what Dependabot reads). Keep it.
      #
      # `ref` is the tag `guards` validated — the build must compile the SAME commit
      # the gate approved, not whatever branch a dispatch happened to run from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guards.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        # @stable is a moving branch ref, not a version tag; pinned to its tip with
        # an explicit toolchain so the SHA pin still selects stable. dtolnay force-pushes
        # `stable` to advance the action, which orphans our (vetted, immutable) pin, so
        # zizmor's impostor-commit audit flags it — ignored below. The pinned SHA was the
        # legitimate stable tip when vetted; an immutable pin beats tracking a moving ref.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust) # zizmor: ignore[impostor-commit]
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri build dependencies
        # Same GTK/WebKit dev stack the pr.yml rust job proves, plus libdbus-1-dev
        # (the keyring crate's Secret Service backend links system libdbus) and
        # libfuse2 (linuxdeploy — the AppImage assembler tauri-bundler downloads —
        # is itself an AppImage; runner images stopped shipping FUSE2 and the
        # bundler dies with a bare "failed to run linuxdeploy" without it).
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev libfuse2

      - run: npm ci

      # Is macOS Developer-ID signing / notarization configured? Both secrets are read
      # HERE and nowhere else, in one isolated step whose env never reaches the build.
      #
      # Two reasons that isolation matters. The cert/identity vars must be ABSENT from
      # the build when unset — an empty-but-defined APPLE_CERTIFICATE makes Tauri
      # attempt `security import` on empty data and fail the bundle (the maiden
      # v2.0.0-alpha release hit exactly this). And a secret declared at JOB level, as
      # APPLE_API_KEY_BASE64 was, is present in every step of the Windows and Linux
      # legs too, which have no use for it — the one Apple secret that was not
      # step-scoped like its siblings.
      #
      # `steps.apple.outputs.*` is "" on Windows and Linux (step skipped), so both
      # always take the unsigned path below.
      - name: Detect Apple signing
        id: apple
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          # Emit only a boolean, never the value — step outputs are not secret-masked
          # by virtue of coming from a secret.
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      # macOS Developer-ID signing + notarization is DORMANT until the Apple secrets
      # exist (the signed/unsigned build split below is what keeps the unsigned build
      # green). notarytool needs the App Store Connect key as a FILE, so when the
      # base64 secret exists this step materialises it and exports APPLE_API_KEY_PATH.
      # Gated on the detect step's output rather than on `env.…`, because a step
      # cannot read its own step-level env from its own `if:` — which is precisely
      # why the secret used to be job-scoped.
      - name: Prepare Apple notarization key
        if: steps.apple.outputs.notarize == 'true'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_dir="$RUNNER_TEMP/appstore"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey.p8" >> "$GITHUB_ENV"

      # Default path: minisign updater signing only (always active). No Apple env is
      # defined here, so macOS bundles unsigned and succeeds. Windows also runs here.
      - name: Build (updater-signed)
        if: steps.apple.outputs.enabled != 'true'
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Linux only (inert elsewhere): run the AppImage tooling by
          # self-extraction, never FUSE-mounting — belt-and-braces with libfuse2 —
          # and skip linuxdeploy's strip pass, which errors on some deployed libs
          # and surfaces only as a bare "failed to run linuxdeploy".
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"

      # Switched on automatically once the Apple secrets exist — no code change needed.
      # APPLE_API_KEY_PATH is exported by the notarization-key step above when configured.
      - name: Build (updater + Apple-signed)
        if: steps.apple.outputs.enabled == 'true'
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      # Clean-profile guard: exercise the *bundled* interpreter exactly as the
      # bundler laid it down. A packaging regression that flattens the Python tree
      # (losing Lib/encodings) makes the document engine dead on first ingest;
      # build + package still succeed, so it would ship silently. This fails the
      # release here instead. The python-smoke job below tests a fresh
      # setup-python, NOT this bundled tree, so it can't catch this.
      - name: Smoke-test the bundled interpreter (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The post-bundle interpreter, wherever Tauri staged the resources (its
          # source lives outside target/, so this only matches the bundled copy).
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
            Where-Object { ($_.FullName -replace '/', '\') -match '\\python\\python\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            throw "bundled python.exe not found under src-tauri/target — the interpreter wasn't bundled."
          }
          Write-Host "bundled interpreter: $exe"
          $root = Split-Path $exe -Parent
          if (-not (Test-Path (Join-Path $root 'Lib\encodings\__init__.py'))) {
            Get-ChildItem -Path $root | Select-Object -First 30 -ExpandProperty Name | Out-String | Write-Host
            throw "bundled stdlib is flattened/incomplete: Lib\encodings\__init__.py is missing under $root"
          }
          & $exe -c "import encodings, venv, ssl; print('bundled interpreter import OK')"
          if ($LASTEXITCODE -ne 0) { throw "the bundled interpreter could not import its standard library." }
          & $exe -m venv "$env:RUNNER_TEMP\pm-smoke-venv"
          if ($LASTEXITCODE -ne 0) { throw "venv creation from the bundled interpreter failed." }
          & "$env:RUNNER_TEMP\pm-smoke-venv\Scripts\python.exe" -c "import encodings; print('venv python import OK')"
          if ($LASTEXITCODE -ne 0) { throw "the created venv's python could not import its standard library." }
          Write-Host "bundled-interpreter clean-profile smoke test passed."

      # Same clean-profile guard as the Windows step above, for the Linux bundle
      # (shared with linux-bundle-dryrun.yml so the two can't drift; the script
      # anchors to the bundle dir so it can't validate tauri-build's compile-time
      # resource copy by mistake).
      - name: Smoke-test the bundled interpreter (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: bash scripts/smoke-bundled-python.sh src-tauri/target/release/bundle

      - name: Stage Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staged
          cp src-tauri/target/release/bundle/nsis/*-setup.exe staged/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig staged/

      - name: Stage macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p staged
          base=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$base"/macos/*.app.tar.gz staged/
          cp "$base"/macos/*.app.tar.gz.sig staged/
          # NOT `|| true`. That shrug meant a bundler run which produced no .dmg
          # published a release with an updater bundle and no installer, silently —
          # nothing downstream asserts the .dmg exists, so a Mac user arriving at the
          # release page would find nothing to install. macos-bundle-dryrun.yml now
          # proves this file gets produced on every PR, so a hard failure here is the
          # correct behaviour rather than a new way to break a release.
          cp "$base"/dmg/*.dmg staged/

      # AppImage (+ its updater .sig — the only Linux format Tauri's updater
      # handles) plus the rpm (Fedora/RHEL) and deb (Debian/Ubuntu) as plain
      # package-manager-installable assets.
      - name: Stage Linux artifacts
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          mkdir -p staged
          base=src-tauri/target/release/bundle
          cp "$base"/appimage/*.AppImage staged/
          cp "$base"/appimage/*.AppImage.sig staged/
          cp "$base"/rpm/*.rpm staged/
          cp "$base"/deb/*.deb staged/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.os }}
          path: staged/*
          if-no-files-found: error

  # --- sidecar-deps smoke: the pinned requirements resolve + import -------
  # Proves requirements.txt installs and imports on each SHIPPED OS (Windows +
  # macOS + Linux) against Python 3.12 — the version Windows and Linux BUNDLE
  # (python-build-standalone, fetched into the bundle by scripts/fetch-python.mjs)
  # and the floor macOS still provisions its runtime venv against. Catches a dep
  # that can't resolve before a release does. (The bundled interpreter is a
  # prebuilt binary, so the build runners still need no Python toolchain to
  # compile.)
  python-smoke:
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's requirements.txt, not a branch's — this smoke exists to prove
          # the deps THIS release pins actually resolve.
          ref: ${{ needs.guards.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Clean venv → install → import sidecar deps
        shell: bash
        run: |
          python -m venv .smoke-venv
          if [ -f .smoke-venv/Scripts/activate ]; then
            source .smoke-venv/Scripts/activate
          else
            source .smoke-venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          python -c "import markitdown, fastembed, faster_whisper; print('sidecar deps import OK')"

  publish:
    needs: [guards, build, python-smoke]
    runs-on: ubuntu-latest
    permissions:
      # The publish job creates a Release on this repo, so its token needs write.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's tree — this job reads tauri.conf.json's pubkey (updater
          # signature verification), about.toml (NOTICE generation) and
          # RELEASE_NOTES.md, and all three must be the release's, not a branch's.
          ref: ${{ needs.guards.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # AGPL hygiene: regenerate the third-party licence NOTICE for the bundled Rust
      # deps and attach it to the release. The accepted-licence set in about.toml is
      # the same one the PR gate (cargo-deny) enforces, so this can't hit a surprise.
      - name: Install Rust
        # zizmor impostor-commit ignore: dtolnay force-pushes `stable`, orphaning our vetted
        # immutable pin (see the notice job above for the full rationale).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust) # zizmor: ignore[impostor-commit]
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install cargo-about
        # Downloaded to a FILE and checksummed before it is unpacked, never piped
        # straight into /usr/local/bin. This job holds `contents: write` and the
        # release token, so an unverified binary executed here is the single highest-
        # value place in the repo to land one — a compromised or MITM'd tarball would
        # be running with the ability to publish releases. The digest is the one
        # EmbarkStudios publishes alongside the asset (…tar.gz.sha256); it moves only
        # when the pinned version does.
        env:
          CARGO_ABOUT_VERSION: "0.9.0"
          CARGO_ABOUT_SHA256: "7a1a1bfb3ae3b6feabe9e1d6147a6b34b85bd0339bfd8b0ec11b312dee10d99a"
        shell: bash
        run: |
          set -euo pipefail
          asset="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLo "$RUNNER_TEMP/$asset.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/$asset.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$asset.tar.gz" | sha256sum --check --strict
          tar -xz -C /usr/local/bin --strip-components=1 -f "$RUNNER_TEMP/$asset.tar.gz" "$asset/cargo-about"
          cargo-about --version
      - name: Generate third-party NOTICE
        run: just notice artifacts/THIRD-PARTY-NOTICES.txt

      - name: Build updater manifest
        env:
          ARTIFACTS_DIR: artifacts
          RELEASES_REPO: ${{ env.RELEASES_REPO }}
          TAG: ${{ needs.guards.outputs.tag }}
          VERSION: ${{ needs.guards.outputs.version }}
          NOTES: "PM ${{ needs.guards.outputs.tag }}"
          OUT: artifacts/latest.json
        run: node scripts/build-updater-manifest.mjs

      - name: Verify updater manifest is internally consistent
        env:
          OUT: artifacts/latest.json
          VERSION: ${{ needs.guards.outputs.version }}
          TAG: ${{ needs.guards.outputs.tag }}
          RELEASES_REPO: ${{ env.RELEASES_REPO }}
        run: node scripts/verify-updater-manifest.mjs

      # The manifest check above proves shape/PRESENCE of signatures, not that they
      # were made by the key the desktops pin. This asserts the key-id in every .sig
      # matches tauri.conf.json's pubkey — a wrong/rotated key would otherwise publish
      # green and silently brick fleet auto-update (T-03).
      - name: Verify updater signatures were made by the shipped key
        env:
          SIG_DIR: artifacts
        run: node scripts/verify-updater-signatures.mjs

      # Publish a SHA256SUMS manifest so a manual downloader of the raw installers can verify
      # integrity (the minisign .sig is updater-only, not a per-file checksum). NOT Authenticode —
      # OS code-signing is blocked on Atlas incorporation (L-9). Runs BEFORE "Publish release": that
      # step's find sweeps every non-.sig / non-latest.json file in artifacts/, so writing
      # artifacts/SHA256SUMS here auto-includes it in the uploaded assets.
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          # Checksum every published asset by basename (assets merge flat here), excluding the
          # signatures and the sums file itself.
          find . -maxdepth 1 -type f ! -name '*.sig' ! -name 'SHA256SUMS' -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guards.outputs.tag }}
        shell: bash
        run: |
          # Upload the installers (.exe/.dmg), the updater bundle (.app.tar.gz),
          # the NOTICE, and latest.json — but not the raw .sig files (folded into
          # latest.json).
          mapfile -t ASSETS < <(find artifacts -type f ! -name '*.sig' ! -name 'latest.json')
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "PM $TAG" \
            --notes-file .github/RELEASE_NOTES.md \
            "${ASSETS[@]}" \
            artifacts/latest.json
