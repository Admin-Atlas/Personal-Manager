name: Release

# Cut a release by pushing a version tag:
#   npm version <patch|minor|major> --no-git-tag-version   # bumps package.json
#   # bump src-tauri/tauri.conf.json + Cargo.toml to match, commit, then:
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds + signs the desktop apps here, then attaches the installers and the
# updater manifest (latest.json) to this repo's own Releases (via GITHUB_TOKEN) so
# every desktop can fetch updates.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/publish (e.g. v0.2.0)"
        required: true

env:
  # Releases attach to this repo; github.repository resolves to <owner>/<name>.
  RELEASES_REPO: ${{ github.repository }}

# The publish job creates a Release on this repo, so GITHUB_TOKEN needs write
# access here. Both jobs inherit this; there is no job-level override.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Empty until the secret is set. Its presence is what flips the notarization-key
      # step (and therefore macOS Developer-ID signing) on — until then the macOS build
      # stays UNSIGNED and succeeds exactly as it does today.
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      # Actions are SHA-pinned; the trailing "# vX.Y.Z" is the human-readable
      # version (and what Dependabot reads). Keep it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        # @stable is a moving branch ref, not a version tag; pinned to its tip with
        # an explicit toolchain so the SHA pin still selects stable.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (re-pin to advance Rust)
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - run: npm ci

      # macOS Developer-ID signing + notarization is DORMANT: Tauri only signs when a real
      # APPLE_SIGNING_IDENTITY is present, so with these secrets unset the macOS build stays
      # unsigned (and still succeeds). To switch it on later, add the Apple secrets — no code
      # change needed. notarytool needs the App Store Connect key as a FILE, so when the
      # base64 secret exists this step materialises it and exports APPLE_API_KEY_PATH.
      - name: Prepare Apple notarization key
        if: matrix.os == 'macos-latest' && env.APPLE_API_KEY_BASE64 != ''
        shell: bash
        run: |
          key_dir="$RUNNER_TEMP/appstore"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build + sign
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # Updater (minisign) signing — already active on every build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer-ID signing + notarization — inert until the secrets exist
          # (Tauri skips signing when APPLE_SIGNING_IDENTITY is empty). APPLE_API_KEY_PATH
          # is exported by the step above when configured.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Stage Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staged
          cp src-tauri/target/release/bundle/nsis/*-setup.exe staged/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig staged/

      - name: Stage macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p staged
          base=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$base"/macos/*.app.tar.gz staged/
          cp "$base"/macos/*.app.tar.gz.sig staged/
          cp "$base"/dmg/*.dmg staged/ || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.os }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: ver
        shell: bash
        # Bind the (attacker-influenceable) dispatch input through env — never
        # inline ${{ }} expansion into the script body — and reject anything that
        # isn't a vX.Y.Z tag with an optional pre-release suffix (e.g. v2.0.0-alpha),
        # so it can't be used for shell injection on the runner that holds the signing
        # key. The suffix charset stays shell-safe: digits, letters, dot and dash only.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to build from an unexpected tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build updater manifest
        env:
          ARTIFACTS_DIR: artifacts
          RELEASES_REPO: ${{ env.RELEASES_REPO }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: "PM ${{ steps.ver.outputs.tag }}"
          OUT: artifacts/latest.json
        run: node scripts/build-updater-manifest.mjs

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          # Upload the installers (.exe/.dmg), the updater bundle (.app.tar.gz),
          # and latest.json — but not the raw .sig files (folded into latest.json).
          mapfile -t ASSETS < <(find artifacts -type f ! -name '*.sig' ! -name 'latest.json')
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "PM $TAG" \
            --notes-file .github/RELEASE_NOTES.md \
            "${ASSETS[@]}" \
            artifacts/latest.json
