# Dependabot — keep PM's dependencies current across its three ecosystems.
#
# The gtk-rs / Linux-WebKit transitive stack is intentionally ignored: it compiles
# only into Tauri's Linux WebKit backend, the affected code is never reached, and
# these crates move as one unit with Tauri (no fix reachable until Tauri moves to
# gtk 0.19 / glib 0.22 or gtk4).
# Mirrors src-tauri/.cargo/audit.toml; see the 2026-06-17 DECISIONS glib entry.
#
# Grouping: each ecosystem's minor and patch updates arrive as ONE pull request a week, not one
# per package. Every Dependabot PR runs the whole PR workflow and both bundle dry-runs, and on
# 2026-11-06 thirteen of them held the Actions queue for hours; PM merges them as one batch
# anyway. Majors still arrive one per PR, because each needs its own decision (typescript 7,
# jsdom 31) and closing a major's PR is how Dependabot remembers that it is held. Security
# updates are not grouped, so a fix never waits behind an unrelated bump.
version: 2
updates:
  # --- Rust backend (src-tauri/Cargo.toml + Cargo.lock) ---
  # tests/sealed-frame/src-tauri is deliberately not listed: that app's lock must match this one's
  # engine crates exactly (its build.rs refuses anything else), so it moves when this one does, by
  # hand, and a bump of it alone could only fail.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "glib*"
      - dependency-name: "gobject*"
      - dependency-name: "gio*"
      - dependency-name: "gdk*"
      - dependency-name: "gtk*"
      - dependency-name: "atk*"
      - dependency-name: "pango*"
      - dependency-name: "cairo*"
      - dependency-name: "soup*"
      - dependency-name: "webkit2gtk*"
      - dependency-name: "javascriptcore*"

  # --- Frontend (package.json + package-lock.json at repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Python sidecar (sidecar/requirements*.txt) ---
  # The last ecosystem without coverage, and the one that matters most per-dependency: these
  # packages are what parse untrusted files (MarkItDown, rapidocr, the archive readers), inside a
  # worker deliberately confined because that parsing is the app's largest attack surface. A CVE
  # here was previously only ever found by `just pip-audit` failing a PR — an alert with no fix
  # attached — rather than by a bump arriving ready to review.
  - package-ecosystem: "pip"
    directory: "/sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- GitHub Actions (.github/workflows/*.yml) — keeps SHA pins current ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
