# Dependabot — keep PM's dependencies current across its three ecosystems.
#
# The gtk-rs / Linux-WebKit transitive stack is intentionally ignored: it compiles
# only into Tauri's Linux WebKit backend, PM ships Windows/macOS, and these crates
# move as one unit with Tauri (no fix reachable until Tauri adopts gtk-rs 0.20).
# Mirrors src-tauri/.cargo/audit.toml; see the 2026-06-17 DECISIONS glib entry.
version: 2
updates:
  # --- Rust backend (src-tauri/Cargo.toml + Cargo.lock) ---
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "glib*"
      - dependency-name: "gobject*"
      - dependency-name: "gio*"
      - dependency-name: "gdk*"
      - dependency-name: "gtk*"
      - dependency-name: "atk*"
      - dependency-name: "pango*"
      - dependency-name: "cairo*"
      - dependency-name: "soup*"
      - dependency-name: "webkit2gtk*"
      - dependency-name: "javascriptcore*"

  # --- Frontend (package.json + package-lock.json at repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # --- GitHub Actions (.github/workflows/*.yml) — keeps SHA pins current ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
