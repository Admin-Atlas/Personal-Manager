# pre-commit — runs the fast check subset on commit. Each hook calls the matching
# `just` recipe, so it runs the EXACT same command as CI and local `just` (one
# source of truth, no drift). The compile/test/supply-chain/security checks
# (clippy, cargo test, cargo-deny, gitleaks, zizmor) are left to CI and
# `just check` — too slow for every commit.
#
# "The fast subset" is now a checked claim, not a comment: `just ci-membership`
# asserts every member of `check-fast` has a hook here. It had drifted to 9 of the
# 13, and the four it was missing — licence-subset, ci-membership, sync-set,
# script-deps — were the drift guards, whose whole job is noticing that two files
# have stopped agreeing. `version` maps to `version-local` (the offline-tolerant
# variant); that one substitution is declared in scripts/check-ci-membership.mjs.
#
# Setup:  pipx install pre-commit && pre-commit install
# Needs:  just, node + npm install (prettier/eslint/tsc), ruff on PATH.
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: just prettier
        language: system
        pass_filenames: false
        always_run: true
      - id: eslint
        name: eslint
        entry: just eslint
        language: system
        pass_filenames: false
        always_run: true
      - id: tsc
        name: tsc --noEmit
        entry: just tsc
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-fmt
        name: cargo fmt --check
        entry: just cargo-fmt
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: just ruff
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-fmt
        name: ruff format --check
        entry: just ruff-fmt
        language: system
        pass_filenames: false
        always_run: true
      - id: version-lockstep
        name: version lockstep + bump (vs origin/main) + changelog
        entry: just version-local
        language: system
        pass_filenames: false
        always_run: true
      - id: files-in-place
        name: files-in-place
        entry: just files
        language: system
        pass_filenames: false
        always_run: true
      - id: spdx-headers
        name: spdx headers + licence
        entry: just headers
        language: system
        pass_filenames: false
        always_run: true
      - id: license-subset
        name: licence allow-lists agree (deny ⊆ about)
        entry: just license-subset
        language: system
        pass_filenames: false
        always_run: true
      - id: ci-membership
        name: CI membership (check-fast ⊆ pr.yml and pre-commit)
        entry: just ci-membership
        language: system
        pass_filenames: false
        always_run: true
      - id: sync-set
        name: sync-set register covers every table
        entry: just sync-set
        language: system
        pass_filenames: false
        always_run: true
      - id: script-deps
        name: scripts/ stays zero-dependency
        entry: just script-deps
        language: system
        pass_filenames: false
        always_run: true
      - id: action-pins
        name: every workflow `uses:` is SHA-pinned
        entry: just action-pins
        language: system
        pass_filenames: false
        always_run: true
